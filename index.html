<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d0f2b">
  <meta name="description" content="비행기 모드에서도 켜지는, 호흡과 명상으로 스르륵 긴장을 푸는 웹앱">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="스르륵">
  <title>스르륵 · 호흡과 명상</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/png" href="/assets/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/assets/icons/icon-192.png">
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <!-- 아이콘 (선 아이콘, 색은 currentColor) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-flame" viewBox="0 0 24 24"><path d="M12 3c1 3.5 5 5.5 5 10a5 5 0 0 1-10 0c0-2 1-3.2 2-4.5.3 1.5 1 2.3 2 2.5C11 8 11 5.5 12 3z"/></symbol>
      <symbol id="i-home" viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1z"/></symbol>
      <symbol id="i-wind" viewBox="0 0 24 24"><path d="M3 9h10a3 3 0 1 0-3-3M3 15h14a3 3 0 1 1-3 3M3 12h6"/></symbol>
      <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></symbol>
      <symbol id="i-cloud-down" viewBox="0 0 24 24"><path d="M7 18a4.5 4.5 0 0 1-.5-9A6 6 0 0 1 18 9.5 4 4 0 0 1 17.5 18M12 11v7m-3-3l3 3 3-3"/></symbol>
      <symbol id="i-cloud-check" viewBox="0 0 24 24"><path d="M7 18a4.5 4.5 0 0 1-.5-9A6 6 0 0 1 18 9.5 4 4 0 0 1 17.5 18zM9.5 13.5l2 2 3.5-3.5"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
      <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z" style="fill:currentColor"/></symbol>
      <symbol id="i-pause" viewBox="0 0 24 24"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z" style="fill:currentColor"/></symbol>
      <symbol id="i-back" viewBox="0 0 24 24"><path d="M12 5a7 7 0 1 1-7 7M12 5L9 2m3 3L9 8"/></symbol>
      <symbol id="i-fwd" viewBox="0 0 24 24"><path d="M12 5a7 7 0 1 0 7 7M12 5l3-3m-3 3l3 3"/></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
      <symbol id="i-down" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></symbol>
      <symbol id="i-lock" viewBox="0 0 24 24"><path d="M7 11V8a5 5 0 0 1 10 0v3M6 11h12v9H6z"/></symbol>
      <symbol id="i-rain" viewBox="0 0 24 24"><path d="M7 15a4 4 0 0 1-.4-8A5.5 5.5 0 0 1 17 8a3.5 3.5 0 0 1 0 7M9 18v2m3-2v3m3-3v2"/></symbol>
      <symbol id="i-wave" viewBox="0 0 24 24"><path d="M3 9c3 0 3 3 6 3s3-3 6-3 3 3 6 3M3 15c3 0 3 3 6 3s3-3 6-3 3 3 6 3"/></symbol>
      <symbol id="i-tree" viewBox="0 0 24 24"><path d="M12 3l5 7h-3l4 6H6l4-6H7zM12 16v5"/></symbol>
      <symbol id="i-deep" viewBox="0 0 24 24"><path d="M3 12h2m3-4v8m4-10v12m4-8v4m4-2h2"/></symbol>
      <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></symbol>
      <symbol id="i-volume" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9zM16.5 9a4 4 0 0 1 0 6"/></symbol>
      <symbol id="i-chevron" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>
    </defs>
  </svg>

  <div class="app">
    <main class="view" id="view-home" data-view="home" tabindex="-1" hidden></main>
    <main class="view" id="view-breathe" data-view="breathe" tabindex="-1" hidden></main>
    <main class="view" id="view-meditate" data-view="meditate" tabindex="-1" hidden></main>
    <main class="view" id="view-offline" data-view="offline" tabindex="-1" hidden></main>
  </div>

  <nav class="tabbar" aria-label="주요 메뉴">
    <a href="#/home" data-tab="home"><svg class="ic" aria-hidden="true"><use href="#i-home"/></svg><span>홈</span></a>
    <a href="#/breathe" data-tab="breathe"><svg class="ic" aria-hidden="true"><use href="#i-wind"/></svg><span>호흡</span></a>
    <a href="#/meditate" data-tab="meditate"><svg class="ic" aria-hidden="true"><use href="#i-moon"/></svg><span>명상</span></a>
  </nav>

  <!-- 호흡 세션 (전체 화면) -->
  <section id="breath-session" class="overlay session" role="dialog" aria-modal="true" aria-label="호흡 운동" hidden>
    <div class="overlay-bg" style="background-image:url(/assets/images/bg-dusk.webp)"></div>
    <div class="scrim"></div>
    <div class="overlay-inner">
      <header class="overlay-head">
        <span id="bs-title" class="tag"></span>
        <button class="icon-btn" id="bs-close" aria-label="종료"><svg class="ic" aria-hidden="true"><use href="#i-close"/></svg></button>
      </header>

      <div class="orb-wrap" id="bs-orb">
        <svg class="ring" viewBox="0 0 200 200" aria-hidden="true">
          <circle class="ring-track" cx="100" cy="100" r="94"/>
          <circle class="ring-bar" id="bs-ring" cx="100" cy="100" r="94" transform="rotate(-90 100 100)"/>
        </svg>
        <div class="orb"><div class="orb-core"></div></div>
        <div class="orb-text">
          <p id="bs-phase" class="phase" aria-live="polite">준비해 주세요</p>
          <p id="bs-count" class="count" aria-hidden="true"></p>
        </div>
      </div>

      <div class="overlay-foot">
        <div class="bar thin" aria-hidden="true"><span id="bs-bar"></span></div>
        <p class="muted small center"><span id="bs-remaining">0:00</span> 남음 · <span id="bs-cycle"></span></p>
        <div class="row gap center">
          <button class="btn ghost" id="bs-pause">일시정지</button>
          <button class="btn ghost" id="bs-stop">종료</button>
        </div>
        <p class="tiny center">어지러우면 멈추고 편하게 호흡하세요.</p>
      </div>

      <div class="done" id="bs-done" hidden>
        <h2>잘하셨어요</h2>
        <p id="bs-done-text" class="muted"></p>
        <div class="stack">
          <button class="btn primary" id="bs-more" hidden>명상 이어가기</button>
          <button class="btn" id="bs-ok">닫기</button>
        </div>
      </div>
    </div>
  </section>

  <!-- 명상 플레이어 (전체 화면) -->
  <section id="player" class="overlay" role="dialog" aria-modal="true" aria-label="명상 플레이어" hidden>
    <div class="overlay-bg" id="pl-img"></div>
    <video id="pl-video" muted loop playsinline autoplay preload="auto" hidden aria-hidden="true"></video>
    <div class="scrim"></div>
    <div class="overlay-inner">
      <header class="overlay-head">
        <button class="icon-btn" id="pl-close" aria-label="닫기"><svg class="ic" aria-hidden="true"><use href="#i-down"/></svg></button>
        <span id="pl-topic" class="tag"></span>
      </header>
      <div class="pl-center">
        <h2 id="pl-title"></h2>
        <div class="spinner" aria-hidden="true"></div>
        <p id="pl-note" class="note" role="status" hidden></p>
      </div>
      <div class="pl-controls">
        <input type="range" id="pl-seek" min="0" max="100" step="1" value="0" aria-label="재생 위치">
        <div class="times"><span id="pl-cur">0:00</span><span id="pl-left">-0:00</span></div>
        <div class="row gap center ctrl">
          <button class="skip" id="pl-back" aria-label="15초 뒤로"><svg class="ic" aria-hidden="true"><use href="#i-back"/></svg><span>15</span></button>
          <button class="play-btn" id="pl-play" aria-label="재생"></button>
          <button class="skip" id="pl-fwd" aria-label="15초 앞으로"><svg class="ic" aria-hidden="true"><use href="#i-fwd"/></svg><span>15</span></button>
        </div>
        <div class="row center">
          <button class="chip toggle" id="pl-amb" aria-pressed="false"><svg class="ic" aria-hidden="true"><use href="#i-volume"/></svg>배경 소리</button>
        </div>
      </div>
    </div>
  </section>

  <dialog id="safety" aria-labelledby="safety-title">
    <form method="dialog">
      <h2 id="safety-title">시작하기 전에</h2>
      <p>어지럽거나 불편하면 멈추고 편하게 호흡하세요. 이 앱은 의료 행위를 대신하지 않습니다.</p>
      <div class="row gap end">
        <button type="button" class="btn" id="safety-cancel">취소</button>
        <button class="btn primary" value="ok">확인했어요</button>
      </div>
    </form>
  </dialog>

  <div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
